services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: fashion_postgres_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: pbtien
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: fashion_db
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbtien -d fashion_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  object-detection:
    build:
      context: ./object_detection
    container_name: fashion_object_detection
    restart: unless-stopped
    environment:
      OBJECT_DETECTION_MODEL_PATH: /models/object-detection/best.pt
      M2_MASK_MODE: ${M2_MASK_MODE:-off}
    ports:
      - "8001:8001"
    volumes:
      - ./object_detection/best.pt:/models/object-detection/best.pt:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fashion_api
    restart: unless-stopped
    environment:
      DB_HOST: postgres-pgvector
      DB_PORT: "5432"
      DB_USER: pbtien
      DB_PASSWORD: change_me
      DB_NAME: fashion_db
      OBJECT_DETECTION_URL: http://object-detection:8001
      API_PORT: "8000"
      MATCH_SCORE_THRESHOLD: ${MATCH_SCORE_THRESHOLD:-0.70}
      MIN_IMAGE_SIMILARITY: ${MIN_IMAGE_SIMILARITY:-0.60}
      ENABLE_TEXT_STYLE_RERANK: ${ENABLE_TEXT_STYLE_RERANK:-true}
      RERANK_IMAGE_WEIGHT: ${RERANK_IMAGE_WEIGHT:-0.60}
      RERANK_CATEGORY_WEIGHT: ${RERANK_CATEGORY_WEIGHT:-0.15}
      RERANK_COLOR_WEIGHT: ${RERANK_COLOR_WEIGHT:-0.15}
      RERANK_TEXT_STYLE_WEIGHT: ${RERANK_TEXT_STYLE_WEIGHT:-0.10}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-patrickjohncyh/fashion-clip}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-2}
      HSV_CONFIG_PATH: /app/config/hsv147.json
      HSV_COLOR_CACHE_PATH: /app/color-cache/catalog.json
      HSV_MISSING_POLICY: ${HSV_MISSING_POLICY:-zero}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${HSV_COLOR_CACHE_FILE:-./data/color_cache_hsv147.json}
        target: /app/color-cache/catalog.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres-pgvector:
        condition: service_healthy
      object-detection:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./web/fe
    container_name: fashion_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgvector_data:
